<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src https://api.dropboxapi.com https://content.dropboxapi.com https://notify.dropboxapi.com https://*.dropboxusercontent.com; media-src https://*.dropboxusercontent.com blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)"><meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한눈">
<title>한눈 — 내 작업실</title>
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot">한눈을 여는 중…</div>

<section id="signin" class="signin" hidden aria-labelledby="signin-title">
  <div class="signin-card">
    <img class="signin-mark" src="favicon.svg" alt="">
    <h1 id="signin-title">한눈 업무판</h1>
    <p class="signin-copy">맥이 꺼져 있어도 아이폰과 맥에서 할 일·메모·회의록을 보고 고칠 수 있어요. 내용은 내 드롭박스 앱 폴더에만 저장돼요.</p>
    <button id="signin-button" class="primary-button signin-button" type="button">드롭박스로 연결</button>
    <p id="signin-error" class="signin-error" role="alert" hidden></p>
    <ul class="signin-notes">
      <li>앱 전용 폴더만 읽고 써요. 다른 드롭박스 파일은 볼 수 없어요.</li>
      <li>연결 정보는 이 기기에만 남아요. 언제든 ‘연결 끊기’로 지울 수 있어요.</li>
      <li class="web-only">아이폰에서는 공유 버튼 › ‘홈 화면에 추가’로 앱처럼 쓸 수 있어요.</li>
    </ul>
  </div>
</section>

<div id="app" class="app-shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="한눈 홈"><img src="favicon.svg" alt=""><span>한눈<span class="brand-sub">나의 작은 작업실</span></span></a>
    <button id="mobile-project-toggle" class="mobile-project-toggle" type="button" aria-expanded="false" aria-controls="project-nav">프로젝트 ⌄</button>
    <nav class="main-nav" aria-label="작업실 메뉴">
      <button class="nav-item" type="button" data-view="home"><span data-icon="home"></span>오늘</button>
      <button class="nav-item" type="button" data-view="overview"><span data-icon="grid"></span>프로젝트</button>
      <button class="nav-item web-only" type="button" data-view="calendar"><span data-icon="calendar"></span>달력</button>
      <button class="nav-item" type="button" data-view="tasks"><span data-icon="check"></span>할 일<span class="nav-count" id="todo-count"></span></button>
      <button class="nav-item" type="button" data-view="notes"><span data-icon="note"></span>메모</button>
      <button class="nav-item" type="button" data-view="meetings"><span data-icon="mic"></span>회의록</button>
    </nav>
    <div class="sidebar-label"><span>프로젝트</span></div>
    <nav id="project-nav" class="project-nav" aria-label="프로젝트 선택"></nav>
    <div class="sidebar-bottom">
      <div class="sync-line"><span id="sync-dot" class="local-dot"></span><span id="sync-text">연결 중</span></div>
      <div id="account-line" class="sidebar-small"></div>
      <button id="signout" class="text-button signout" type="button">연결 끊기</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <span id="today" class="today"></span>
      <div class="top-actions">
        <button id="record-open" class="secondary-button meeting-start" type="button"><span data-icon="mic"></span>새 녹음</button>
        <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="찾기" aria-label="작업실에서 찾기" autocomplete="off"></label>
        <button id="sync-now" class="icon-button" type="button" aria-label="지금 동기화" title="지금 동기화"><span data-icon="refresh"></span></button>
      </div>
    </header>
    <div id="recording-bar" class="meeting-recording-bar" role="status" aria-live="polite" hidden></div>
    <main>
      <div id="banners" class="banners" aria-live="polite"></div>
      <div class="page-heading"><div><h1 id="page-title">결과물</h1><p id="page-description"></p></div><div id="heading-action"></div></div>
      <div id="content" class="content"></div>
      <footer><span id="footer-sync"></span><span class="footer-account"><span id="footer-account"></span><button id="signout-mobile" class="text-button" type="button">연결 끊기</button></span></footer>
    </main>
  </div>
</div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" type="button" aria-label="닫기"><span data-icon="close"></span></button></div>
  <div id="dialog-body"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
